version: '3.8'

services:
  news-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news-show-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - news-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/categories"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  news-network:
    driver: bridge

volumes:
  node-modules:
